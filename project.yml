name: VoiceTranslator
options:
  bundleIdPrefix: com.voicetranslator
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    PRODUCT_NAME: VoiceTranslator
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  VoiceTranslator:
    type: application
    platform: iOS
    sources:
      - path: VoiceTranslator
        excludes:
          - "**/.DS_Store"
    info:
      path: VoiceTranslator/App/Info.plist
      properties:
        CFBundleName: VoiceTranslator
        CFBundleDisplayName: VoiceTranslator
        CFBundleIdentifier: com.voicetranslator.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSMicrophoneUsageDescription: "ใช้ไมโครโฟนเพื่อรับฟังเสียงและแปลภาษาแบบเรียลไทม์"
        NSSpeechRecognitionUsageDescription: "ใช้การรู้จำเสียงเพื่อแปลงคำพูดเป็นข้อความบนอุปกรณ์"
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicetranslator.app
        INFOPLIST_FILE: VoiceTranslator/App/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    entitlements:
      path: VoiceTranslator/VoiceTranslator.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.voicetranslator.shared
    dependencies:
      - target: BroadcastExtension
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - "**/.DS_Store"
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: VoiceTranslator Broadcast
        CFBundleIdentifier: com.voicetranslator.app.broadcast
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicetranslator.app.broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.voicetranslator.shared
