name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios-voice-translator
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          cd ios-voice-translator
          xcodebuild archive \
            -project VoiceTranslator.xcodeproj \
            -scheme VoiceTranslator \
            -destination "generic/platform=iOS" \
            -archivePath ./build/VoiceTranslator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package as IPA
        run: |
          cd ios-voice-translator/build
          mkdir -p Payload
          cp -r VoiceTranslator.xcarchive/Products/Applications/VoiceTranslator.app Payload/
          zip -r VoiceTranslator-unsigned.ipa Payload/
          echo "IPA size: $(du -sh VoiceTranslator-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslator-unsigned-${{ github.sha }}
          path: ios-voice-translator/build/VoiceTranslator-unsigned.ipa
          retention-days: 30
